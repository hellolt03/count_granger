ablation:
  name: target_scores_softmax_weighted_level
  description: Target-aware level score using softmax-weighted top-k aggregation.

granger:
  target_score_enabled: true
  target_score_top_ratio: 0.05
  target_score_top_min: 3
  target_score_aggregation: softmax_weighted_mean
  target_score_softmax_temperature: 1.0
  target_score_min_scale: 0.000001

detect:
  score_component: validation_best
  candidate_components:
    - score
    - residual
    - edge
    - level
