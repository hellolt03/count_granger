ablation:
  name: target_scores_multi_scope
  description: Target-aware rank-weighted level with selected/top-50/top-100 scopes in one validation-best run.

granger:
  target_score_enabled: true
  target_score_feature_scopes:
    - selected
    - top_50
    - top_100
  target_score_top_ratio: 0.05
  target_score_top_min: 3
  target_score_aggregation: rank_weighted_mean
  target_score_rank_weight_power: 1.0
  target_score_min_scale: 0.000001

detect:
  score_component: validation_best
  candidate_components:
    - score
    - residual
    - edge
    - level_selected
    - level_top50
    - level_top100
    - edge_level_fusion
  edge_level_fusion_level_components:
    - level_selected
    - level_top50
    - level_top100
  edge_level_fusion_level_weights:
    - 0.25
    - 0.5
    - 0.75
  edge_level_fusion_normalized: true
