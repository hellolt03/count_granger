ablation:
  name: target_scores_score_weighted_level
  description: Target-aware level score using score-weighted top-k aggregation.

granger:
  target_score_enabled: true
  target_score_top_ratio: 0.05
  target_score_top_min: 3
  target_score_aggregation: score_weighted_mean
  target_score_min_scale: 0.000001

detect:
  score_component: validation_best
  candidate_components:
    - score
    - residual
    - edge
    - level
