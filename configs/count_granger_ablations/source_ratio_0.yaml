ablation:
  name: source_ratio_0
  description: Target-aware level with source sampling ratio 0.0, equivalent to target-only fitting when target train is enabled.

run:
  source_sample_ratio: 0.0

granger:
  target_score_enabled: true
  target_score_top_ratio: 0.05
  target_score_top_min: 3
  target_score_min_scale: 0.000001

detect:
  score_component: validation_best
  candidate_components:
    - score
    - residual
    - edge
    - level
